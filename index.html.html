<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 지구 역사 탐험대 - 변화와 다양성</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
body {
  background: linear-gradient(135deg, #1a2540 0%, #2d3f5f 50%, #1e3a5f 100%);
  min-height: 100vh;
  color: #f0f4f8;
  padding: 20px;
  overflow-x: hidden;
}
.container { max-width: 1000px; margin: 0 auto; }

/* Header */
.header {
  text-align: center;
  padding: 20px 0 30px;
  animation: fadeInDown 0.6s ease;
}
.header h1 {
  font-size: 2.2em;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #ffd93d, #ff8b3d, #ff5f6d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p { color: #a0b3cc; font-size: 1em; }

/* Progress Bar */
.progress-container {
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 4px;
  margin: 20px 0;
  border: 1px solid rgba(255,255,255,0.15);
}
.progress-bar {
  height: 24px;
  background: linear-gradient(90deg, #ffd93d, #ff8b3d);
  border-radius: 18px;
  transition: width 0.6s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85em;
  font-weight: bold;
  color: #1a2540;
  min-width: 60px;
}

/* Home - Stage Map */
.stage-map {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 30px;
}
.stage-card {
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.stage-card:not(.locked):hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  border-color: #ffd93d;
}
.stage-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
  filter: grayscale(70%);
}
.stage-card.completed {
  border-color: #4ade80;
  background: rgba(74, 222, 128, 0.1);
}
.stage-icon { font-size: 3em; margin-bottom: 10px; }
.stage-number {
  font-size: 0.85em;
  color: #ffd93d;
  font-weight: bold;
  margin-bottom: 4px;
}
.stage-title { font-size: 1.3em; margin-bottom: 8px; font-weight: bold; }
.stage-desc { font-size: 0.9em; color: #a0b3cc; line-height: 1.5; }
.stage-page {
  display: inline-block;
  background: rgba(255,217,61,0.2);
  color: #ffd93d;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.8em;
  margin-top: 10px;
}
.stage-status {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 1.5em;
}

/* Learning Objectives Panel */
.objective-panel {
  background: rgba(255,255,255,0.06);
  border-left: 4px solid #ffd93d;
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
}
.objective-panel h3 { color: #ffd93d; margin-bottom: 12px; font-size: 1.1em; }
.objective-item {
  display: flex;
  gap: 12px;
  margin: 10px 0;
  align-items: flex-start;
  padding: 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
}
.objective-label {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 4px 12px;
  border-radius: 10px;
  font-size: 0.8em;
  font-weight: bold;
  white-space: nowrap;
  min-width: 90px;
  text-align: center;
}
.objective-text { font-size: 0.95em; line-height: 1.6; }

/* Stage Content */
.stage-content {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 30px;
  animation: fadeIn 0.5s ease;
}
.stage-content h2 {
  color: #ffd93d;
  margin-bottom: 15px;
  font-size: 1.8em;
}
.stage-content h3 {
  color: #a0d8ff;
  margin: 20px 0 12px;
  font-size: 1.2em;
}
.info-box {
  background: rgba(255,255,255,0.06);
  padding: 18px;
  border-radius: 12px;
  margin: 12px 0;
  line-height: 1.7;
  border-left: 3px solid #a0d8ff;
}
.source-tag {
  display: inline-block;
  background: rgba(255,139,61,0.2);
  color: #ff8b3d;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 0.8em;
  margin-left: 8px;
}
.highlight { color: #ffd93d; font-weight: bold; }
.key-term {
  background: rgba(255,217,61,0.2);
  padding: 2px 8px;
  border-radius: 6px;
  color: #ffd93d;
  font-weight: bold;
}

/* Buttons */
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 25px;
  font-size: 1em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  margin: 5px;
}
.btn-primary {
  background: linear-gradient(135deg, #ffd93d, #ff8b3d);
  color: #1a2540;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,217,61,0.4); }
.btn-secondary {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
}
.btn-secondary:hover { background: rgba(255,255,255,0.2); }
.btn-success {
  background: linear-gradient(135deg, #4ade80, #22c55e);
  color: white;
}

.btn-row { display: flex; justify-content: space-between; margin-top: 25px; flex-wrap: wrap; gap: 10px; }

/* Games */
.game-area {
  background: rgba(0,0,0,0.2);
  border-radius: 15px;
  padding: 20px;
  margin: 15px 0;
  min-height: 200px;
}
.game-title {
  color: #ff8b3d;
  font-size: 1.2em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Drag & Drop */
.drag-item {
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 12px 18px;
  border-radius: 10px;
  cursor: move;
  user-select: none;
  transition: all 0.2s;
  color: white;
  font-weight: 500;
  margin: 5px;
  display: inline-block;
}
.drag-item:hover { transform: scale(1.05); }
.drag-item.dragging { opacity: 0.5; }
.drop-zone {
  background: rgba(255,255,255,0.05);
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: 12px;
  padding: 20px;
  min-height: 80px;
  margin: 10px 0;
  transition: all 0.2s;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.drop-zone.drag-over {
  background: rgba(255,217,61,0.1);
  border-color: #ffd93d;
}
.drop-zone.correct {
  background: rgba(74,222,128,0.15);
  border-color: #4ade80;
  border-style: solid;
}
.drop-zone.incorrect {
  background: rgba(239,68,68,0.15);
  border-color: #ef4444;
  border-style: solid;
}
.zone-label {
  font-weight: bold;
  color: #ffd93d;
  margin-bottom: 8px;
  width: 100%;
}

/* Sorting Game */
.sort-item {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  padding: 15px;
  border-radius: 10px;
  cursor: move;
  margin: 8px 0;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s;
}
.sort-item:hover { border-color: #ffd93d; }
.sort-item.dragging { opacity: 0.4; }
.sort-number {
  background: #ffd93d;
  color: #1a2540;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  flex-shrink: 0;
}

/* Multiple Choice */
.choice-btn {
  display: block;
  width: 100%;
  padding: 15px 20px;
  margin: 8px 0;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  font-size: 0.95em;
}
.choice-btn:hover:not(.disabled) {
  background: rgba(255,255,255,0.15);
  border-color: #ffd93d;
  transform: translateX(5px);
}
.choice-btn.correct {
  background: rgba(74,222,128,0.2);
  border-color: #4ade80;
}
.choice-btn.incorrect {
  background: rgba(239,68,68,0.2);
  border-color: #ef4444;
}
.choice-btn.disabled { cursor: not-allowed; }

/* Feedback */
.feedback {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  animation: slideIn 0.3s ease;
}
.feedback.correct {
  background: rgba(74,222,128,0.15);
  border: 1px solid #4ade80;
}
.feedback.incorrect {
  background: rgba(239,68,68,0.15);
  border: 1px solid #ef4444;
}
.feedback-title {
  font-weight: bold;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Score */
.score-display {
  display: flex;
  justify-content: space-around;
  background: rgba(255,255,255,0.06);
  padding: 15px;
  border-radius: 15px;
  margin: 15px 0;
}
.score-item { text-align: center; }
.score-value {
  font-size: 1.8em;
  font-weight: bold;
  color: #ffd93d;
}
.score-label {
  font-size: 0.85em;
  color: #a0b3cc;
}

/* Badge */
.badge {
  display: inline-block;
  padding: 20px 30px;
  background: linear-gradient(135deg, #ffd93d, #ff8b3d);
  color: #1a2540;
  border-radius: 20px;
  font-weight: bold;
  margin: 10px;
  animation: bounce 0.6s ease;
  text-align: center;
}
.badge-icon { font-size: 2.5em; display: block; }

/* Metacognition */
.meta-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 15px;
  padding: 20px;
  margin: 12px 0;
}
.confidence-slider {
  width: 100%;
  margin: 15px 0;
  cursor: pointer;
}
.confidence-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.85em;
  color: #a0b3cc;
  margin-top: 5px;
}
.reflection-textarea {
  width: 100%;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  color: white;
  font-family: inherit;
  font-size: 0.95em;
  min-height: 80px;
  resize: vertical;
}
.reflection-textarea:focus {
  outline: none;
  border-color: #ffd93d;
}

/* Match Game */
.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin: 15px 0;
}
.match-column { display: flex; flex-direction: column; gap: 8px; }
.match-item {
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.2);
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.match-item:hover:not(.matched) { background: rgba(255,255,255,0.15); border-color: #ffd93d; }
.match-item.selected { background: rgba(255,217,61,0.2); border-color: #ffd93d; }
.match-item.matched {
  background: rgba(74,222,128,0.15);
  border-color: #4ade80;
  cursor: not-allowed;
}

/* Timeline */
.timeline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #4a1a5a 0%, #2d6a4f 25%, #d4a017 50%, #ff8b3d 100%);
  height: 40px;
  border-radius: 20px;
  padding: 0 20px;
  margin: 20px 0;
  position: relative;
  color: white;
  font-weight: bold;
  font-size: 0.85em;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

/* Timeline chart for geological time */
.geo-chart {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 15px 0;
}
.geo-era {
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}
.geo-era:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
.geo-precambrian { background: linear-gradient(135deg, #4a1a5a, #6b2d7a); }
.geo-paleozoic { background: linear-gradient(135deg, #2d6a4f, #52b788); }
.geo-mesozoic { background: linear-gradient(135deg, #d4a017, #f4c430); color: #1a2540; }
.geo-cenozoic { background: linear-gradient(135deg, #ff8b3d, #ff5f6d); }

/* Modal */
.modal-backdrop {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  border-radius: 20px;
}
.modal-content {
  background: linear-gradient(135deg, #2d3f5f, #1e3a5f);
  padding: 30px;
  border-radius: 20px;
  max-width: 500px;
  text-align: center;
  border: 2px solid #ffd93d;
}
.modal-content h2 { color: #ffd93d; margin-bottom: 15px; }

/* Reset button */
.reset-btn {
  position: fixed;
  top: 15px;
  right: 15px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  padding: 8px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85em;
  z-index: 200;
}
.reset-btn:hover { background: rgba(239,68,68,0.4); }

/* Collapsible Objective Banner */
.obj-banner {
  background: linear-gradient(135deg, rgba(255,217,61,0.12), rgba(255,139,61,0.08));
  border: 1px solid rgba(255,217,61,0.3);
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
  transition: all 0.3s;
}
.obj-banner-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}
.obj-banner-header:hover { background: rgba(255,217,61,0.08); }
.obj-banner-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
  color: #ffd93d;
  font-size: 0.95em;
}
.obj-banner-toggle {
  color: #ffd93d;
  font-size: 1.2em;
  transition: transform 0.3s;
}
.obj-banner.expanded .obj-banner-toggle { transform: rotate(180deg); }
.obj-banner-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s;
  padding: 0 18px;
}
.obj-banner.expanded .obj-banner-body {
  max-height: 500px;
  padding: 5px 18px 15px;
}
.obj-mini {
  display: flex;
  gap: 10px;
  margin: 8px 0;
  align-items: flex-start;
  padding: 8px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  font-size: 0.88em;
}
.obj-mini-label {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 0.78em;
  font-weight: bold;
  white-space: nowrap;
  min-width: 80px;
  text-align: center;
  flex-shrink: 0;
}
.obj-mini-text { line-height: 1.5; }
.obj-banner-source {
  font-size: 0.8em;
  color: #a0b3cc;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(255,255,255,0.1);
}

/* Fossil Image Cards */
.fossil-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin: 15px 0;
}
.fossil-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.3s;
  cursor: pointer;
}
.fossil-card:hover {
  transform: translateY(-3px);
  border-color: #ffd93d;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.fossil-img-wrap {
  width: 100%;
  height: 120px;
  background: linear-gradient(135deg, #3a4a6a, #2d3f5f);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.fossil-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
  background: white; /* 캡처 이미지가 투명 배경일 경우를 대비해 흰색 배경 추가 */
}
.fossil-card:hover .fossil-img-wrap img { transform: scale(1.08); }
.fossil-img-fallback {
  font-size: 3em;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 0;
}
.fossil-img-wrap img { position: relative; z-index: 1; }
.fossil-info {
  padding: 10px 12px;
}
.fossil-name {
  font-weight: bold;
  color: #ffd93d;
  margin-bottom: 4px;
  font-size: 0.95em;
}
.fossil-desc {
  font-size: 0.8em;
  color: #a0b3cc;
  line-height: 1.4;
}

/* Image with caption inline */
.inline-fossil {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.06);
  padding: 6px 10px;
  border-radius: 20px;
  margin: 3px;
}
.inline-fossil-img {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255,217,61,0.4);
  background: white;
}

/* Draggable creature with image */
.drag-item-img {
  background: linear-gradient(135deg, #667eea, #764ba2);
  padding: 8px 14px 8px 8px;
  border-radius: 25px;
  cursor: move;
  user-select: none;
  transition: all 0.2s;
  color: white;
  font-weight: 500;
  margin: 5px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.drag-item-img:hover { transform: scale(1.05); }
.drag-item-img.dragging { opacity: 0.5; }
.drag-item-img img {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  background: white;
}

/* Match item with image */
.match-item-img {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 10px 12px;
}
.match-item-img img {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  background: white;
}
.match-item-img .m-text { flex: 1; font-size: 0.92em; }

/* Modal for fossil detail */
.fossil-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 20px;
}
.fossil-modal.active { display: flex; }
.fossil-modal-content {
  background: linear-gradient(135deg, #2d3f5f, #1e3a5f);
  border-radius: 20px;
  max-width: 500px;
  width: 100%;
  overflow: hidden;
  border: 2px solid #ffd93d;
  animation: fadeIn 0.3s;
}
.fossil-modal-img {
  width: 100%;
  height: 280px;
  object-fit: contain; /* 이미지가 잘리지 않게 조정 */
  background: #1a2540;
}
.fossil-modal-body { padding: 20px; }
.fossil-modal-title {
  color: #ffd93d;
  font-size: 1.5em;
  margin-bottom: 10px;
}
.fossil-modal-close {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 1.2em;
  cursor: pointer;
  z-index: 10;
}
.fossil-modal-close:hover { background: rgba(239,68,68,0.6); }

/* Responsive */
@media (max-width: 600px) {
  body { padding: 10px; }
  .header h1 { font-size: 1.6em; }
  .stage-content { padding: 20px 15px; }

function fossilCard(key) {
  const f = fossilDB[key];
  if (!f) return '';
  return `
    <div class="fossil-card" onclick="event.stopPropagation(); showFossilDetail('${key}')">
      <div class="fossil-info">
        <div class="fossil-name">${f.name}</div>
        <div class="fossil-desc">${f.era} · ${f.kind}</div>
      </div>
    </div>
  `;
}

function fossilGallery(keys) {
  return `<div class="fossil-gallery">${keys.map(k => fossilCard(k)).join('')}</div>`;
}

function showFossilDetail(key) {
  const f = fossilDB[key];
  if (!f) return;
  const modal = document.createElement('div');
  modal.className = 'fossil-modal active';
  modal.innerHTML = `
    <div class="fossil-modal-content" style="position:relative;">
      <button class="fossil-modal-close" onclick="this.parentElement.parentElement.remove()">✕</button>
      <div class="fossil-modal-body">
        <div class="fossil-modal-title">${f.name}</div>
        <div style="display:inline-block; background:rgba(255,217,61,0.2); color:#ffd93d; padding:3px 10px; border-radius:10px; font-size:0.85em; margin-bottom:10px;">${f.era} · ${f.kind}</div>
        <p style="line-height:1.6; color:#f0f4f8;">${f.desc}</p>
      </div>
    </div>
  `;
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

function initSortable() {
  const container = document.getElementById('sort-container');
  let dragged = null;

  container.querySelectorAll('.sort-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragged = item;
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', e => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => {
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const midpoint = rect.top + rect.height / 2;
      if (e.clientY < midpoint) container.insertBefore(dragged, item);
      else container.insertBefore(dragged, item.nextSibling);
    });
  });
}

function checkOrder() {
  const items = document.querySelectorAll('#sort-container .sort-item');
  let correct = true;
  items.forEach((item, i) => {
    const numDiv = item.querySelector('.sort-number');
    numDiv.textContent = i + 1;
    if (parseInt(item.dataset.order) !== i + 1) correct = false;
  });

  const feedback = document.getElementById('order-feedback');
  if (correct) {
    feedback.innerHTML = `
      <div class="feedback correct">
        <div class="feedback-title">🎉 정답입니다!</div>
        <p>화석 생성 과정을 완벽하게 이해했어요! 생물이 죽은 후 → 연한 부분 분해 → 단단한 부분 보존 → 지표로 노출 순서입니다.</p>
      </div>
    `;
    stage1State.orderCorrect = true;
    stage1State.score += 50;
    document.getElementById('next-btn').style.display = 'inline-block';
  } else {
    feedback.innerHTML = `
      <div class="feedback incorrect">
        <div class="feedback-title">🤔 다시 시도해보세요!</div>
        <p>순서를 다시 생각해보세요. 힌트: 생물이 <span class="highlight">묻히는 것</span>이 첫 단계예요!</p>
      </div>
    `;
    items.forEach(item => item.querySelector('.sort-number').textContent = '?');
  }
}

function initDragDrop() {
  const items = document.querySelectorAll('.drag-item, .drag-item-img');
  const zones = document.querySelectorAll('.drop-zone');
  let dragged = null;

  items.forEach(item => {
    item.addEventListener('dragstart', e => {
      dragged = item;
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', e => item.classList.remove('dragging'));
  });

  zones.forEach(zone => {
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', e => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if (dragged) zone.appendChild(dragged);
    });
  });

  // Pool as drop zone too
  const pool = document.getElementById('condition-pool');
  if (pool) {
    pool.addEventListener('dragover', e => e.preventDefault());
    pool.addEventListener('drop', e => {
      e.preventDefault();
      if (dragged) pool.appendChild(dragged);
    });
  }
}

function checkConditions() {
  const zones = document.querySelectorAll('.drop-zone');
  let allCorrect = true;
  let totalPlaced = 0;

  zones.forEach(zone => {
    const accept = zone.dataset.accept;
    const items = zone.querySelectorAll('.drag-item');
    let zoneCorrect = true;
    items.forEach(item => {
      totalPlaced++;
      if (item.dataset.type !== accept) {
        zoneCorrect = false;
        allCorrect = false;
      }
    });
    zone.classList.remove('correct', 'incorrect');
    if (items.length > 0) zone.classList.add(zoneCorrect ? 'correct' : 'incorrect');
  });

  const feedback = document.getElementById('condition-feedback');
  if (totalPlaced < 6) {
    feedback.innerHTML = `<div class="feedback incorrect"><div class="feedback-title">⚠️ 모든 항목을 분류해주세요!</div></div>`;
    return;
  }

  if (allCorrect) {
    feedback.innerHTML = `
      <div class="feedback correct">
        <div class="feedback-title">🎉 완벽합니다!</div>
        <p>화석 생성 조건을 정확히 이해했어요! <span class="highlight">개체 수가 많고, 단단한 부분이 있고, 지각변동이 적고, 퇴적암 지역</span>일 때 화석이 잘 만들어집니다.</p>
      </div>
    `;
    stage1State.conditionCorrect = true;
    stage1State.score += 50;
    document.getElementById('complete-btn').style.display = 'inline-block';
  } else {
    feedback.innerHTML = `
      <div class="feedback incorrect">
        <div class="feedback-title">🤔 다시 확인해보세요!</div>
        <p>힌트: <span class="highlight">마그마의 열</span>이나 <span class="highlight">지각 변동</span>은 화석을 파괴할 수 있어요!</p>
      </div>
    `;
  }
}

let selected = { left: null, right: null };
let matchedCount = 0;

function selectMatch(el, side, key) {
  if (el.classList.contains('matched')) return;

  // Deselect other of same side
  document.querySelectorAll(`#${side}-col .match-item`).forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  selected[side] = { el, key };

  if (selected.left && selected.right) {
    if (selected.left.key === selected.right.key) {
      selected.left.el.classList.remove('selected');
      selected.right.el.classList.remove('selected');
      selected.left.el.classList.add('matched');
      selected.right.el.classList.add('matched');
      matchedCount++;

      if (matchedCount === 7) {
        document.getElementById('match-feedback').innerHTML = `
          <div class="feedback correct">
            <div class="feedback-title">🎉 모든 화석 감정 완료!</div>

          </div>
        `;
        stage2State.matchCorrect = true;
        stage2State.score += 50;
        document.getElementById('complete-btn2').style.display = 'inline-block';
      }
    } else {
      setTimeout(() => {
        if (selected.left) selected.left.el.classList.remove('selected');
        if (selected.right) selected.right.el.classList.remove('selected');
      }, 800);
    }
    selected = { left: null, right: null };
  }
}

function checkEras() {
  const zones = document.querySelectorAll('.drop-zone');
  let allCorrect = true;
  let totalPlaced = 0;

  zones.forEach(zone => {
    const accept = zone.dataset.accept;
    const items = zone.querySelectorAll('.drag-item, .drag-item-img');
    let zoneCorrect = true;
    items.forEach(item => {
      totalPlaced++;
      if (item.dataset.type !== accept) {
        zoneCorrect = false;
        allCorrect = false;
      }
    });
    zone.classList.remove('correct', 'incorrect');
    if (items.length > 0) zone.classList.add(zoneCorrect ? 'correct' : 'incorrect');
  });

  const feedback = document.getElementById('era-feedback');
  if (totalPlaced < 11) {
    feedback.innerHTML = `<div class="feedback incorrect"><div class="feedback-title">⚠️ 모든 생물을 분류해주세요!</div></div>`;
    return;
  }

  if (allCorrect) {
    feedback.innerHTML = `
      <div class="feedback correct">
        <div class="feedback-title">🎉 완벽합니다!</div>
        <p>모든 생물을 알맞은 시대에 배치했어요! 시간 여행 대성공! 🚀</p>
      </div>
    `;
    stage3State.score += 50;
    document.getElementById('complete-btn3').style.display = 'inline-block';
  } else {
    feedback.innerHTML = `
      <div class="feedback incorrect">
        <div class="feedback-title">🤔 몇 개가 틀렸어요</div>
        <p>힌트: 삼엽충·필석·갑주어·방추충은 <span class="highlight">고생대</span>, 암모나이트·공룡·시조새는 <span class="highlight">중생대</span>, 화폐석·매머드는 <span class="highlight">신생대</span>, 스트로마톨라이트·에디아카라 동물군은 <span class="highlight">선캄브리아</span>예요!</p>
      </div>
    `;
  }
}

function answerStage4(idx) {
  const q = stage4Questions[stage4State.qIndex];
  const btns = document.querySelectorAll('#quiz-container .choice-btn');
  btns.forEach((b, i) => {
    b.classList.add('disabled');
    if (i === q.correct) b.classList.add('correct');
    if (i === idx && i !== q.correct) b.classList.add('incorrect');
  });

  const isCorrect = idx === q.correct;
  if (isCorrect) stage4State.correctCount++;

  document.getElementById('q4-feedback').innerHTML = `
    <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
      <div class="feedback-title">${isCorrect ? '✅ 정답!' : '❌ 아쉬워요'}</div>
      <p>${q.explain}</p>
      <button class="btn btn-primary" onclick="nextStage4Q()" style="margin-top:12px;">
        ${stage4State.qIndex < stage4Questions.length - 1 ? '다음 문제 ▶️' : '결과 확인 🎯'}
      </button>
    </div>
  `;
}

function nextStage4Q() {
  stage4State.qIndex++;
  if (stage4State.qIndex < stage4Questions.length) {
    showStage4Question();

    const passLine = Math.ceil(total * 0.6); // 5문항이면 3개

    document.getElementById('quiz-container').innerHTML = `

function stage5Next() { stage5State.step = 'quiz'; showStage5(); }

let currentAnswer = null;

function selectAnswer(idx) {
  currentAnswer = idx;
  document.querySelectorAll('#q-choices .choice-btn').forEach((b, i) => {
    b.classList.remove('selected');
    if (i === idx) b.style.background = 'rgba(255,217,61,0.2)';
    else b.style.background = '';
  });
  document.getElementById('confidence-section').style.display = 'block';
}

function updateConfLabel(val) {
  const labels = ['', '전혀 모름', '잘 모름', '보통', '어느 정도 확신', '완전 확신'];
  document.getElementById('conf-label').textContent = `${labels[val]} (${val}/5)`;
}

function submitAnswer() {
  if (currentAnswer === null) {
    alert('먼저 답을 선택해주세요!');
    return;
  }
  const conf = parseInt(document.getElementById('conf-slider').value);
  const q = finalQuestions[stage5State.qIndex];

  stage5State.answers.push({
    q: stage5State.qIndex,
    selected: currentAnswer,
    correct: q.correct,
    isCorrect: currentAnswer === q.correct,
    confidence: conf,
    topic: q.topic
  });

  currentAnswer = null;
  stage5State.qIndex++;

  if (stage5State.qIndex < 10) {
    showStage5();
  } else {
    stage5State.step = 'reflection';
    showStage5();
  }
}

function finishReflection() {
  stage5State.meta = {
    strong: document.getElementById('strong-area').value,
    weak: document.getElementById('weak-area').value,
    plan: document.getElementById('plan-area').value
  };
  stage5State.step = 'result';
  showStage5();
}

function showFinalResult() {
  const answers = stage5State.answers;
  const correct = answers.filter(a => a.isCorrect).length;
  const percent = Math.round((correct / 10) * 100);

  // Metacognition analysis
  const overconfident = answers.filter(a => !a.isCorrect && a.confidence >= 4).length;
  const underconfident = answers.filter(a => a.isCorrect && a.confidence <= 2).length;
  const wellCalibrated = answers.filter(a =>
    (a.isCorrect && a.confidence >= 4) || (!a.isCorrect && a.confidence <= 2)
  ).length;

  // Wrong topics
  const wrongTopics = answers.filter(a => !a.isCorrect).map(a => a.topic);
  const wrongUnique = [...new Set(wrongTopics)];

  let grade = '', gradeColor = '', gradeMsg = '';
  if (percent >= 90) { grade = 'S'; gradeColor = '#ffd93d'; gradeMsg = '완벽해요! 지구 역사 마스터!'; }
  else if (percent >= 80) { grade = 'A'; gradeColor = '#4ade80'; gradeMsg = '훌륭해요! 매우 잘 이해했어요!'; }
  else if (percent >= 70) { grade = 'B'; gradeColor = '#a0d8ff'; gradeMsg = '잘했어요! 조금만 더 복습하면 완벽!'; }
  else if (percent >= 60) { grade = 'C'; gradeColor = '#ff8b3d'; gradeMsg = '기본은 이해했지만 복습이 필요해요.'; }
  else { grade = 'D'; gradeColor = '#ef4444'; gradeMsg = '프린트를 다시 한번 살펴봐요!'; }

  // Metacognition score
  let metaScore = 'Good';
  let metaColor = '#4ade80';
  let metaMsg = '';
  if (overconfident >= 3) {
    metaScore = '⚠️ 과신 주의';
    metaColor = '#ef4444';
    metaMsg = `틀린 문제 중 ${overconfident}개는 확신했지만 틀렸어요. 스스로 안다고 생각한 부분을 더 꼼꼼히 확인해보세요!`;
  } else if (underconfident >= 3) {
    metaScore = '😊 겸손형';
    metaColor = '#a0d8ff';
    metaMsg = `실제로는 잘 아는데 확신이 부족해요. 자신감을 가져도 좋아요!`;
  } else if (wellCalibrated >= 6) {
    metaScore = '🎯 최고';
    metaColor = '#ffd93d';
    metaMsg = `자신이 아는 것과 모르는 것을 정확히 파악하고 있어요! 훌륭한 메타인지 능력!`;
  } else {
    metaMsg = `아는 것과 모르는 것을 조금 더 명확히 구분해보세요.`;
  }

  document.getElementById('app').innerHTML = `
    <div class="stage-content">
      <div style="text-align:center;">
        <div style="font-size:4em;">${percent >= 80 ? '🏆' : percent >= 60 ? '🎖️' : '📚'}</div>
        <h2>마스터 챌린지 결과</h2>
      </div>
      ${makeObjBanner(4)}

      <div class="score-display">
        <div class="score-item">
          <div class="score-value" style="color:${gradeColor};">${grade}</div>
          <div class="score-label">등급</div>
        </div>
        <div class="score-item">
          <div class="score-value">${correct}/10</div>
          <div class="score-label">정답 수</div>
        </div>
        <div class="score-item">
          <div class="score-value">${percent}%</div>
          <div class="score-label">정답률</div>
        </div>
      </div>

      <div class="info-box" style="border-left-color:${gradeColor}; text-align:center;">
        <p style="font-size:1.1em;">${gradeMsg}</p>
      </div>

      <h3 style="color:#ffd93d; margin-top:25px;">🧠 메타인지 분석</h3>
      <div class="meta-card" style="border-left:4px solid ${metaColor};">
        <div style="font-size:1.3em; font-weight:bold; color:${metaColor};">${metaScore}</div>
        <p style="margin-top:8px;">${metaMsg}</p>
        <div style="display:flex; gap:15px; margin-top:12px; font-size:0.9em;">
          <div>✅ 잘 맞춘 확신: <strong>${wellCalibrated}개</strong></div>
          <div>⚠️ 과신 오답: <strong>${overconfident}개</strong></div>
          <div>😊 겸손한 정답: <strong>${underconfident}개</strong></div>
        </div>
      </div>

      ${wrongUnique.length > 0 ? `
        <h3 style="color:#ff8b3d; margin-top:20px;">📖 복습이 필요한 부분</h3>
        <div class="info-box" style="border-left-color:#ff8b3d;">
          ${wrongUnique.map(t => `<div style="margin:5px 0;">• ${t}</div>`).join('')}
        </div>
      ` : `
        <h3 style="color:#4ade80; margin-top:20px;">✨ 완벽한 이해!</h3>
        <div class="info-box" style="border-left-color:#4ade80;">
          <p>모든 문제를 맞혔어요! 정말 대단해요! 🎊</p>
        </div>
      `}

      ${stage5State.meta.strong || stage5State.meta.weak || stage5State.meta.plan ? `
        <h3 style="color:#a0d8ff; margin-top:20px;">📝 나의 학습 성찰</h3>
        ${stage5State.meta.strong ? `<div class="meta-card"><strong style="color:#ffd93d;">🌟 강점:</strong> ${stage5State.meta.strong}</div>` : ''}
        ${stage5State.meta.weak ? `<div class="meta-card"><strong style="color:#ff8b3d;">🤔 약점:</strong> ${stage5State.meta.weak}</div>` : ''}
        ${stage5State.meta.plan ? `<div class="meta-card"><strong style="color:#a0d8ff;">📅 계획:</strong> ${stage5State.meta.plan}</div>` : ''}
      ` : ''}

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="renderStage5()">🔄 다시 도전</button>
        <button class="btn btn-primary" onclick="completeStage(4)">완료 & 지도로 🏠</button>
      </div>
    </div>
  `;

  state.finalScore = percent;
  state.metacognition = stage5State.meta;
  saveState();
}

// ============ COMPLETE STAGE ============
function completeStage(stageId) {
  state.completed[stageId] = true;
  saveState();

  const s = stages[stageId];
  document.getElementById('app').innerHTML = `
    <div class="stage-content" style="text-align:center;">
      <div class="badge">
        <span class="badge-icon">${s.icon}</span>
        <div style="font-size:1.1em;">${s.title} 뱃지 획득!</div>
      </div>

      <h2 style="margin:20px 0;">🎉 STAGE ${stageId+1} 완료!</h2>

      <div class="info-box" style="max-width:500px; margin:20px auto; text-align:left;">
        <h3>🎯 이번 스테이지에서 배운 것</h3>
        ${s.objectives.map(o => `
          <div style="margin:8px 0; padding:8px; background:rgba(74,222,128,0.1); border-radius:8px;">
            ✅ ${o.text}
          </div>
        `).join('')}
      </div>

      ${stageId < 4 ? `
        <p style="color:#a0b3cc; margin:15px 0;">🔓 다음 스테이지가 해금되었어요!</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-secondary" onclick="goHome()">🏠 지도로</button>
          <button class="btn btn-primary" onclick="startStage(${stageId+1})">다음 스테이지 ▶️</button>
        </div>
      ` : `
        <div style="font-size:3em; margin:20px 0;">🎊🎊🎊</div>
        <p style="color:#ffd93d; font-size:1.2em; font-weight:bold;">모든 스테이지 클리어!</p>
        <p style="margin:15px 0;">당신은 이제 <strong>지구 역사 마스터</strong>입니다!</p>
        <button class="btn btn-primary" onclick="goHome()" style="margin-top:20px;">🏠 지도로 돌아가기</button>
      `}
    </div>
  `;
  updateProgress();
}

// ============ ROUTER ============
function render() {
  if (state.currentStage === 'home') renderHome();
  else showObjectives(state.currentStage);
  updateProgress();
}

// Initial render
render();
</script>

</body>
</html>
